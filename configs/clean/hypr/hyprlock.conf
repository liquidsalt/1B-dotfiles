# Font
$font = IBM Plex Mono

# Colors
$colorBg      = rgba(111111cc)
$colorSurface = rgba(222222cc)
$colorFg      = rgba(ffffffff)
$colorFgDim   = rgba(ffffff99)
$colorFgFaint = rgba(ffffff55)
$colorOutline = rgba(ffffff44)
$colorFail    = rgba(cc4444ff)

general {
    disable_loading_bar = true
    hide_cursor         = true
    grace               = 0
    no_fade_in          = false
    no_fade_out         = false
    ignore_empty_input  = false
    text_trim           = true
}

background {
    monitor     =
    path        = screenshot
    blur_passes = 3
    blur_size   = 6
    brightness  = 0.55
    color       = $colorBg
}

# Cluster

label {
    monitor     =
    text        = cmd[update:0] echo "$USER" | tr '[:lower:]' '[:upper:]'
    color       = $colorFg
    font_size   = 13
    font_family = $font
    position    = 0, 118
    halign      = center
    valign      = center
    shadow_passes = 0
}

label {
    monitor     =
    text        = $TIME
    color       = $colorFg
    font_size   = 64
    font_family = $font
    position    = 0, 40
    halign      = center
    valign      = center
    shadow_passes = 0
}

label {
    monitor     =
    text        = cmd[update:60000] date '+%Y / %m / %d'
    color       = $colorFgDim
    font_size   = 10
    font_family = $font
    position    = 0, -16
    halign      = center
    valign      = center
    shadow_passes = 0
}

input-field {
    monitor           =
    size              = 300, 36
    position          = 0, -68
    halign            = center
    valign            = center
    outline_thickness = 1
    rounding          = 0
    inner_color       = $colorSurface
    outer_color       = $colorOutline
    font_color        = $colorFg
    check_color       = $colorFg
    fail_color        = $colorFail
    fail_text         = AUTHENTICATION FAILED
    placeholder_text  =
    dots_size         = 0.22
    dots_spacing      = 0.20
    dots_center       = true
    dots_rounding     = -1
    fade_on_empty     = false
    hide_input        = false
}

# Corner

label {
    monitor     =
    text        = cmd[update:0] uname -n
    color       = $colorFgFaint
    font_size   = 9
    font_family = $font
    position    = 30, 30
    halign      = left
    valign      = bottom
    shadow_passes = 0
}
